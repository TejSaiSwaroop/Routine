name: Routine Agent Deployment Pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 18 * * *' # Keeps your daily 11:30 PM IST cron active!
  workflow_dispatch: 

# # THE FIX: This forces all JavaScript actions to use Node 24 right now
# env:
#   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Synchronize Deterministic Environment
      run: uv sync --locked

    - name: Run and Deploy Routine Agent
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHATID: ${{ secrets.TELEGRAM_CHATID }}
      run: uv run routine_agent.py